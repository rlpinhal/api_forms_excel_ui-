<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sweet Moment | Encomenda de Bolos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Quicksand', sans-serif; 
            background-color: #fdf8f5; 
            background-image: radial-gradient(#f3e8df 1px, transparent 1px);
            background-size: 20px 20px;
        }
        h1, h2 { font-family: 'Playfair Display', serif; }
        .cake-card {
            background: #ffffff;
            border: 2px solid #f3e8df;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .cake-card:focus-within {
            border-color: #d97706;
            box-shadow: 0 10px 15px -3px rgba(217, 119, 6, 0.1);
        }
        .btn-order {
            background: linear-gradient(135deg, #d97706 0%, #b45309 100%);
            transition: transform 0.2s ease;
        }
        .btn-order:hover {
            transform: scale(1.02);
            filter: brightness(1.1);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="max-w-lg w-full cake-card rounded-3xl p-8 md:p-10 relative overflow-hidden">
        <div class="absolute top-0 left-0 w-full h-2 bg-amber-500"></div>
        
        <header class="text-center mb-8">
            <div class="inline-block p-3 bg-amber-50 rounded-full mb-4">
                <svg class="w-8 h-8 text-amber-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 15.546c-.523 0-1.046.151-1.5.454a2.704 2.704 0 01-3 0 2.704 2.704 0 00-3 0 2.704 2.704 0 01-3 0 2.704 2.704 0 00-3 0 2.704 2.704 0 01-3 0 2.701 2.701 0 00-1.5-.454M9 16v2c0 1.1.9 2 2 2h2a2 2 0 002-2v-2M9 12h6m-6 4h6m2-4h7l-3.5-7L11 2 7.5 5 4 12h7m0 0v8" />
                </svg>
            </div>
            <h1 class="text-3xl text-amber-900 italic">Sweet Moment</h1>
            <p class="text-stone-500 text-sm mt-1 uppercase tracking-widest font-semibold">Confeitaria Artesanal</p>
        </header>

        <form action="https://docs.google.com/forms/d/e/1FAIpQLSdrzWjYDmWl3fAK7mcMr4Ni_9ol9hv5Ve5mKEyG8rZiyLIY9Q/formResponse" method="POST" id="cake-form">
            
            <div class="space-y-6">
                <div class="relative">
                    <label class="text-xs font-bold text-amber-800 ml-1">QUEM VAI RECEBER O CARINHO?</label>
                    <input type="text" name="entry.1687628342" placeholder="Seu nome completo" required
                        class="w-full mt-1 p-4 bg-stone-50 border-2 border-stone-100 rounded-2xl focus:ring-0 focus:border-amber-500 outline-none transition-all placeholder:text-stone-300">
                </div>

                <div>
                    <label class="text-xs font-bold text-amber-800 ml-1">QUANTIDADE DE DELÍCIAS</label>
                    <div class="flex items-center mt-1">
                        <input type="number" name="entry.440788284" value="1" min="1" required
                            class="w-full p-4 bg-stone-50 border-2 border-stone-100 rounded-2xl focus:border-amber-500 outline-none transition-all">
                        <span class="ml-3 text-stone-400 font-medium italic text-sm">unidades</span>
                    </div>
                </div>

                <div>
                    <label class="text-xs font-bold text-amber-800 ml-1">DESEJOS ESPECIAIS (SABORES, ALERGIAS...)</label>
                    <textarea name="entry.58888179" rows="3" placeholder="Ex: Bolo de cenoura com cobertura extra de chocolate..." required
                        class="w-full mt-1 p-4 bg-stone-50 border-2 border-stone-100 rounded-2xl focus:border-amber-500 outline-none transition-all placeholder:text-stone-300"></textarea>
                </div>

                <div>
                    <label class="text-xs font-bold text-amber-800 ml-1">PRECISA DE ENTREGA EM DOMICÍLIO?</label>
                    <div class="grid grid-cols-2 gap-4 mt-2">
                        <label class="cursor-pointer">
                            <input type="radio" name="entry.1007921080" value="Sim" checked class="hidden peer">
                            <div class="p-3 text-center rounded-xl border-2 border-stone-100 peer-checked:border-amber-500 peer-checked:bg-amber-50 text-stone-500 peer-checked:text-amber-700 font-bold transition-all">
                                Sim, por favor!
                            </div>
                        </label>
                        <label class="cursor-pointer">
                            <input type="radio" name="entry.1007921080" value="Não" class="hidden peer">
                            <div class="p-3 text-center rounded-xl border-2 border-stone-100 peer-checked:border-amber-500 peer-checked:bg-amber-50 text-stone-500 peer-checked:text-amber-700 font-bold transition-all">
                                Retirada na loja
                            </div>
                        </label>
                    </div>
                </div>
            </div>

            <div class="mt-10">
                <button type="submit" class="w-full p-5 rounded-2xl btn-order text-white font-bold text-lg shadow-lg shadow-amber-200">
                    Confirmar meu Pedido 🍰
                </button>
                <p class="text-[11px] text-center text-stone-400 mt-4 italic font-medium">
                    "A vida é curta demais para não comer bolo."
                </p>
            </div>
        </form>
    </div>

    <script>
        // Feedback de interação para o usuário
        document.getElementById('cake-form').onsubmit = function() {
            const btn = this.querySelector('button');
            btn.innerHTML = "Enviando para a cozinha...";
            btn.style.opacity = "0.7";
        };
    </script>
</body>
</html>
